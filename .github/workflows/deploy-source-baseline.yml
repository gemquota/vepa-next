name: Validate VEPA Next mainline and Pages payload

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vepa-next-mainline-validation
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run product and SIM contract suites
        run: npm run test:all
      - name: Check generated specs and repository consistency
        run: npm run repository:check
      - name: Build the GitHub Pages application
        run: VITE_BASE=/vepa-next/ npm run build
      - name: Verify deployable output
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Built Pages payload from ${GITHUB_SHA}: dist/"
