name: Rebuild from pinned stable VEPA source

on:
  push:
    branches:
      - rebuild/source-faithful-baseline

permissions:
  contents: write

concurrency:
  group: source-faithful-rebuild
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/source-faithful-baseline
          fetch-depth: 0

      - name: Fetch pinned stable source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/gemquota/vepa.git "$RUNNER_TEMP/stable-vepa-git"
          git -C "$RUNNER_TEMP/stable-vepa-git" checkout --detach 24b56aff316d6de5a960943d6bcb9192a8d569ce
          mkdir -p "$RUNNER_TEMP/stable-vepa-source"
          git -C "$RUNNER_TEMP/stable-vepa-git" archive 24b56aff316d6de5a960943d6bcb9192a8d569ce | tar -x -C "$RUNNER_TEMP/stable-vepa-source"

      - name: Replace prototype tree with stable VEPA
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.base/' \
            --exclude='.github/' \
            "$RUNNER_TEMP/stable-vepa-source/" ./
          git add -A
          if git diff --cached --quiet; then
            echo "Target already matches the pinned stable source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(rebuild): copy pinned stable VEPA baseline"
          git push origin HEAD:rebuild/source-faithful-baseline
