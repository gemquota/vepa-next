name: Validate VEPA Next and Pages payload

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vepa-next-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture immutable source and dependency baseline
        run: npm run baseline:capture
      - name: Capture deterministic product solver golden fixture
        run: npm run golden:capture
      - name: Run product and SIM contract suites
        run: npm run test:all
      - name: Check generated specs and repository consistency
        run: npm run repository:check
      - name: Check source syntax
        run: npm run syntax-check
      - name: Build the GitHub Pages application
        run: VITE_BASE=/vepa-next/ npm run build
      - name: Install Chromium for production-preview acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify built Pages payload, worker and main-thread fallback
        run: npm run test:e2e:baseline
      - name: Upload baseline, golden fixture and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vepa-gate0-evidence-${{ github.sha }}
          path: |
            .artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
