name: VEPA Next CI (9.3.5 product + SIM foundation)

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-unit:
    name: Product unit (9.3.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  sim-foundation:
    name: SIM foundation contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-foundation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
